<svg viewBox="0 0 560 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Zoom sobre Entrenamiento y Export ONNX leyendo desde Feast y registrando en MLflow">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7e93a3" />
    </marker>
  </defs>
  <style>
    text { font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Consolas, monospace; }
    .band-label { font-size: 11px; letter-spacing: 0.08em; fill: #5b6572; }
    .node-box { fill: #ffffff; stroke: #d3d9df; stroke-width: 1.25; }
    .node-title { font-size: 13px; font-weight: 600; fill: #1c222b; }
    .node-caption { font-size: 10px; fill: #5b6572; }
    .trace-halo { stroke: #ffffff; stroke-width: 5; fill: none; }
    .trace-solid { stroke: #7e93a3; stroke-width: 1.6; fill: none; }
    .trace-dashed { stroke: #7e93a3; stroke-width: 1.4; stroke-dasharray: 4 3; fill: none; }
    .edge-label { font-size: 9.5px; fill: #5b6572; }
    .edge-label-bg { fill: #ffffff; opacity: 0.9; }
  </style>

  <rect x="0" y="0" width="560" height="280" fill="#ffffff" />

  <g transform="translate(-500,-30)">
    <rect x="480" y="46" width="580" height="108" fill="#e4e8ec" />
    <rect x="480" y="186" width="580" height="118" fill="#e4e8ec" />
    <text class="band-label" x="520" y="62">ENTRENAMIENTO OFFLINE · PYTHON</text>
    <text class="band-label" x="520" y="202">INFRAESTRUCTURA CORE</text>

    <path class="trace-halo" d="M870,216 L870,180 L700,180 L700,144" />
    <path class="trace-dashed" d="M870,216 L870,180 L700,180 L700,144" marker-end="url(#arrow)" />
    <rect class="edge-label-bg" x="730" y="195" width="140" height="14" />
    <text class="edge-label" x="732" y="206">features punto-en-tiempo</text>

    <path class="trace-halo" d="M620,144 L620,216" />
    <path class="trace-solid" d="M620,144 L620,216" marker-end="url(#arrow)" />
    <rect class="edge-label-bg" x="624" y="170" width="94" height="14" />
    <text class="edge-label" x="626" y="181">run + registro</text>

    <path class="trace-halo" d="M720,110 L840,110" />
    <path class="trace-solid" d="M720,110 L840,110" marker-end="url(#arrow)" />

    <g opacity="0.4">
      <rect class="node-box" x="520" y="216" width="200" height="78" rx="6" />
      <rect x="520" y="216" width="5" height="78" fill="#6f6a9c" />
      <text class="node-title" x="536" y="245">MLflow</text>
      <text class="node-caption" x="536" y="261">Tracking +</text>
      <text class="node-caption" x="536" y="274">Model Registry</text>

      <rect class="node-box" x="840" y="216" width="180" height="78" rx="6" />
      <rect x="840" y="216" width="5" height="78" fill="#6f6a9c" />
      <text class="node-title" x="856" y="245">Feast</text>
      <text class="node-caption" x="856" y="261">Feature store</text>
      <text class="node-caption" x="856" y="274">offline + online</text>
    </g>

    <rect class="node-box" x="520" y="76" width="200" height="68" rx="6" />
    <rect x="520" y="76" width="5" height="68" fill="#b8842a" />
    <text class="node-title" x="536" y="102">Entrenamiento</text>
    <text class="node-caption" x="536" y="118">train.py</text>
    <text class="node-caption" x="536" y="131">XGBoost + CV</text>

    <rect class="node-box" x="840" y="76" width="180" height="68" rx="6" />
    <rect x="840" y="76" width="5" height="68" fill="#b8842a" />
    <text class="node-title" x="856" y="102">Export ONNX</text>
    <text class="node-caption" x="856" y="118">export_onnx.py</text>
  </g>
</svg>
