<svg viewBox="0 0 860 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Zoom sobre la API de inferencia y sus conexiones a ONNX, Postgres y MLflow">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7e93a3" />
    </marker>
  </defs>
  <style>
    text { font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Consolas, monospace; }
    .band-label { font-size: 11px; letter-spacing: 0.08em; fill: #5b6572; }
    .node-box { fill: #ffffff; stroke: #d3d9df; stroke-width: 1.25; }
    .node-title { font-size: 13px; font-weight: 600; fill: #1c222b; }
    .node-caption { font-size: 10px; fill: #5b6572; }
    .trace-halo { stroke: #ffffff; stroke-width: 5; fill: none; }
    .trace-solid { stroke: #7e93a3; stroke-width: 1.6; fill: none; }
    .trace-dashed { stroke: #7e93a3; stroke-width: 1.4; stroke-dasharray: 4 3; fill: none; }
    .edge-label { font-size: 9.5px; fill: #5b6572; }
    .edge-label-bg { fill: #ffffff; opacity: 0.9; }
  </style>

  <rect x="0" y="0" width="860" height="430" fill="#ffffff" />

  <g transform="translate(-180,-30)">
    <rect x="800" y="46" width="260" height="108" fill="#e4e8ec" />
    <rect x="170" y="186" width="600" height="118" fill="#e4e8ec" />
    <rect x="480" y="326" width="280" height="118" fill="#e4e8ec" />
    <text class="band-label" x="800" y="62">PYTHON</text>
    <text class="band-label" x="200" y="202">INFRAESTRUCTURA CORE</text>
    <text class="band-label" x="190" y="422">SERVING + MONITOREO</text>

    <path class="trace-halo" d="M860,144 L860,150 L780,150 L780,375 L720,375" />
    <path class="trace-dashed" d="M860,144 L860,150 L780,150 L780,375 L720,375" marker-end="url(#arrow)" />
    <rect class="edge-label-bg" x="724" y="230" width="112" height="14" />
    <text class="edge-label" x="726" y="241">volumen .onnx</text>

    <path class="trace-halo" d="M620,294 L620,356" />
    <path class="trace-dashed" d="M620,356 L620,294" marker-end="url(#arrow)" />
    <rect class="edge-label-bg" x="624" y="315" width="128" height="14" />
    <text class="edge-label" x="626" y="326">consulta versión</text>

    <path class="trace-halo" d="M560,356 L400,255" />
    <path class="trace-solid" d="M560,356 L400,255" marker-end="url(#arrow)" />
    <rect class="edge-label-bg" x="452" y="296" width="98" height="14" />
    <text class="edge-label" x="454" y="307">prediction_logs</text>

    <g opacity="0.4">
      <rect class="node-box" x="840" y="76" width="180" height="68" rx="6" />
      <rect x="840" y="76" width="5" height="68" fill="#b8842a" />
      <text class="node-title" x="856" y="102">Export ONNX</text>
      <text class="node-caption" x="856" y="118">export_onnx.py</text>

      <rect class="node-box" x="200" y="216" width="200" height="78" rx="6" />
      <rect x="200" y="216" width="5" height="78" fill="#6f6a9c" />
      <text class="node-title" x="216" y="242">Postgres</text>
      <text class="node-caption" x="216" y="258">feature_metadata</text>
      <text class="node-caption" x="216" y="271">features · logs</text>
      <text class="node-caption" x="216" y="284">mlflow (backend)</text>

      <rect class="node-box" x="520" y="216" width="200" height="78" rx="6" />
      <rect x="520" y="216" width="5" height="78" fill="#6f6a9c" />
      <text class="node-title" x="536" y="245">MLflow</text>
      <text class="node-caption" x="536" y="261">Tracking +</text>
      <text class="node-caption" x="536" y="274">Model Registry</text>
    </g>

    <rect class="node-box" x="520" y="356" width="200" height="78" rx="6" />
    <rect x="520" y="356" width="5" height="78" fill="#1f8f7f" />
    <text class="node-title" x="536" y="382">API de inferencia</text>
    <text class="node-caption" x="536" y="398">Node.js · Fastify</text>
    <text class="node-caption" x="536" y="411">ONNX Runtime</text>
  </g>
</svg>
