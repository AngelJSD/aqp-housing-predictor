<svg viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Comparación de R² de test antes y después de eliminar el data leakage de district_avg_price_per_m2">
  <style>
    text { font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Consolas, monospace; }
    .title { font-size: 14px; font-weight: 600; fill: #1c222b; }
    .axis-label { font-size: 10.5px; fill: #5b6572; }
    .group-label { font-size: 13px; font-weight: 600; fill: #1c222b; }
    .value-label { font-size: 13px; font-weight: 600; fill: #1c222b; }
    .gap-label { font-size: 10px; fill: #5b6572; }
    .legend-text { font-size: 11.5px; fill: #1c222b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .bar-baseline { fill: #af5a3c; }
    .bar-definitivo { fill: #1f8f7f; }
    .axis-line { stroke: #d3d9df; stroke-width: 1; }
    .grid-line { stroke: #e4e8ec; stroke-width: 1; }
  </style>

  <rect x="0" y="0" width="900" height="470" fill="#ffffff" />

  <text class="title" x="20" y="30">R² de test: antes y después de sacar el leakage real de district_avg_price_per_m2</text>

  <!-- grid + axis -->
  <line class="grid-line" x1="110" y1="70" x2="800" y2="70" />
  <line class="grid-line" x1="110" y1="147.5" x2="800" y2="147.5" />
  <line class="grid-line" x1="110" y1="225" x2="800" y2="225" />
  <line class="grid-line" x1="110" y1="302.5" x2="800" y2="302.5" />
  <line class="axis-line" x1="110" y1="380" x2="800" y2="380" />
  <line class="axis-line" x1="110" y1="70" x2="110" y2="380" />

  <text class="axis-label" x="100" y="73" text-anchor="end">1.00</text>
  <text class="axis-label" x="100" y="150.5" text-anchor="end">0.75</text>
  <text class="axis-label" x="100" y="228" text-anchor="end">0.50</text>
  <text class="axis-label" x="100" y="305.5" text-anchor="end">0.25</text>
  <text class="axis-label" x="100" y="383" text-anchor="end">0.00</text>

  <!-- divider between groups -->
  <line x1="460" y1="70" x2="460" y2="380" stroke="#e4e8ec" stroke-width="1" stroke-dasharray="3 4" />

  <!-- Venta: baseline -->
  <text class="gap-label" x="205" y="108.6" text-anchor="middle">gap 0.20</text>
  <text class="value-label" x="205" y="134.6" text-anchor="middle">0.76</text>
  <rect class="bar-baseline" x="160" y="144.6" width="90" height="235.4" rx="3" />

  <!-- Venta: definitivo -->
  <text class="gap-label" x="315" y="201.5" text-anchor="middle">gap 0.12</text>
  <text class="value-label" x="315" y="227.5" text-anchor="middle">0.46</text>
  <rect class="bar-definitivo" x="270" y="237.5" width="90" height="142.5" rx="3" />

  <text class="group-label" x="260" y="404" text-anchor="middle">Venta</text>

  <!-- Alquiler: baseline -->
  <text class="gap-label" x="605" y="178.5" text-anchor="middle">gap 0.45</text>
  <text class="value-label" x="605" y="204.5" text-anchor="middle">0.53</text>
  <rect class="bar-baseline" x="560" y="214.5" width="90" height="165.5" rx="3" />

  <!-- Alquiler: definitivo -->
  <text class="gap-label" x="715" y="291.6" text-anchor="middle">gap 0.31</text>
  <text class="value-label" x="715" y="317.6" text-anchor="middle">0.17</text>
  <rect class="bar-definitivo" x="670" y="327.6" width="90" height="52.4" rx="3" />

  <text class="group-label" x="660" y="404" text-anchor="middle">Alquiler</text>

  <!-- legend -->
  <rect x="220" y="430" width="13" height="13" rx="3" class="bar-baseline" />
  <text class="legend-text" x="240" y="440.5">Baseline con leakage (paso 3)</text>

  <rect x="490" y="430" width="13" height="13" rx="3" class="bar-definitivo" />
  <text class="legend-text" x="510" y="440.5">Definitivo sin leakage, re-tuneado (paso 6)</text>
</svg>
