<svg viewBox="0 0 880 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Zoom sobre el Dashboard consultando a la API, Postgres, MLflow, Prometheus y Evidently">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7e93a3" />
    </marker>
    <marker id="arrow-primary" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1f8f7f" />
    </marker>
  </defs>
  <style>
    text { font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Consolas, monospace; }
    .band-label { font-size: 11px; letter-spacing: 0.08em; fill: #5b6572; }
    .node-box { fill: #ffffff; stroke: #d3d9df; stroke-width: 1.25; }
    .node-title { font-size: 13px; font-weight: 600; fill: #1c222b; }
    .node-caption { font-size: 10px; fill: #5b6572; }
    .trace-halo { stroke: #ffffff; stroke-width: 5; fill: none; }
    .trace-dashed { stroke: #7e93a3; stroke-width: 1.4; stroke-dasharray: 4 3; fill: none; }
    .trace-primary { stroke: #1f8f7f; stroke-width: 2.6; fill: none; }
    .trace-primary-halo { stroke: #ffffff; stroke-width: 6; fill: none; }
    .edge-label { font-size: 9.5px; fill: #5b6572; }
    .edge-label-bg { fill: #ffffff; opacity: 0.9; }
  </style>

  <rect x="0" y="0" width="880" height="400" fill="#ffffff" />

  <g transform="translate(-180,-190)">
    <rect x="170" y="186" width="900" height="118" fill="#e4e8ec" />
    <rect x="170" y="326" width="900" height="118" fill="#e4e8ec" />
    <rect x="170" y="466" width="900" height="118" fill="#e4e8ec" />
    <text class="band-label" x="200" y="202">INFRAESTRUCTURA CORE</text>
    <text class="band-label" x="200" y="342">SERVING + MONITOREO</text>
    <text class="band-label" x="500" y="482">PRODUCTO</text>

    <path class="trace-halo" d="M500,510 L450,510 L450,255 L400,255" />
    <path class="trace-dashed" d="M500,510 L450,510 L450,255 L400,255" marker-end="url(#arrow)" />

    <path class="trace-halo" d="M500,525 L465,525 L465,395 L400,395" />
    <path class="trace-dashed" d="M500,525 L465,525 L465,395 L400,395" marker-end="url(#arrow)" />

    <path class="trace-halo" d="M740,510 L780,510 L780,255 L720,255" />
    <path class="trace-dashed" d="M740,510 L780,510 L780,255 L720,255" marker-end="url(#arrow)" />

    <path class="trace-halo" d="M740,525 L800,525 L800,395 L840,395" />
    <path class="trace-dashed" d="M740,525 L800,525 L800,395 L840,395" marker-end="url(#arrow)" />

    <path class="trace-primary-halo" d="M620,496 L620,434" />
    <path class="trace-primary" d="M620,496 L620,434" marker-end="url(#arrow-primary)" />
    <rect class="edge-label-bg" x="500" y="450" width="112" height="14" />
    <text class="edge-label" x="502" y="461">proxy /predict</text>

    <g opacity="0.4">
      <rect class="node-box" x="200" y="216" width="200" height="78" rx="6" />
      <rect x="200" y="216" width="5" height="78" fill="#6f6a9c" />
      <text class="node-title" x="216" y="242">Postgres</text>
      <text class="node-caption" x="216" y="258">feature_metadata</text>
      <text class="node-caption" x="216" y="271">features · logs</text>
      <text class="node-caption" x="216" y="284">mlflow (backend)</text>

      <rect class="node-box" x="520" y="216" width="200" height="78" rx="6" />
      <rect x="520" y="216" width="5" height="78" fill="#6f6a9c" />
      <text class="node-title" x="536" y="245">MLflow</text>
      <text class="node-caption" x="536" y="261">Tracking +</text>
      <text class="node-caption" x="536" y="274">Model Registry</text>

      <rect class="node-box" x="200" y="356" width="200" height="78" rx="6" />
      <rect x="200" y="356" width="5" height="78" fill="#af5a3c" />
      <text class="node-title" x="216" y="385">Evidently</text>
      <text class="node-caption" x="216" y="401">drift_report.py</text>
      <text class="node-caption" x="216" y="414">reportes HTML</text>

      <rect class="node-box" x="520" y="356" width="200" height="78" rx="6" />
      <rect x="520" y="356" width="5" height="78" fill="#1f8f7f" />
      <text class="node-title" x="536" y="382">API de inferencia</text>
      <text class="node-caption" x="536" y="398">Node.js · Fastify</text>
      <text class="node-caption" x="536" y="411">ONNX Runtime</text>

      <rect class="node-box" x="840" y="356" width="180" height="78" rx="6" />
      <rect x="840" y="356" width="5" height="78" fill="#af5a3c" />
      <text class="node-title" x="856" y="385">Prometheus</text>
      <text class="node-caption" x="856" y="401">Métricas de servicio</text>
    </g>

    <rect class="node-box" x="500" y="496" width="240" height="78" rx="6" />
    <rect x="500" y="496" width="5" height="78" fill="#1f8f7f" />
    <text class="node-title" x="516" y="525">Dashboard</text>
    <text class="node-caption" x="516" y="541">Next.js — App Router</text>
    <text class="node-caption" x="516" y="554">todo el fetching es server-side</text>
  </g>
</svg>
