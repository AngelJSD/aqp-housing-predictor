<svg viewBox="0 0 420 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Zoom sobre Feast y Redis: el feature store offline/online y el materialize">
  <style>
    text { font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Consolas, monospace; }
    .band-label { font-size: 11px; letter-spacing: 0.08em; fill: #5b6572; }
    .node-box { fill: #ffffff; stroke: #d3d9df; stroke-width: 1.25; }
    .node-title { font-size: 13px; font-weight: 600; fill: #1c222b; }
    .node-caption { font-size: 10px; fill: #5b6572; }
    .trace-dotted { stroke: #7e93a3; stroke-width: 1.2; stroke-dasharray: 1.5 3; fill: none; opacity: 0.75; }
    .edge-label { font-size: 9.5px; fill: #5b6572; }
  </style>

  <rect x="0" y="0" width="420" height="150" fill="#ffffff" />

  <g transform="translate(-800,-176)">
    <rect x="800" y="186" width="440" height="118" fill="#e4e8ec" />
    <text class="band-label" x="840" y="202">INFRAESTRUCTURA CORE</text>

    <path class="trace-dotted" d="M1020,255 L1060,255" />
    <text class="edge-label" x="1000" y="270" text-anchor="middle">materialize</text>

    <rect class="node-box" x="840" y="216" width="180" height="78" rx="6" />
    <rect x="840" y="216" width="5" height="78" fill="#6f6a9c" />
    <text class="node-title" x="856" y="245">Feast</text>
    <text class="node-caption" x="856" y="261">Feature store</text>
    <text class="node-caption" x="856" y="274">offline + online</text>

    <rect class="node-box" x="1060" y="216" width="140" height="78" rx="6" />
    <rect x="1060" y="216" width="5" height="78" fill="#6f6a9c" />
    <text class="node-title" x="1076" y="245">Redis</text>
    <text class="node-caption" x="1076" y="261">Online store</text>
  </g>
</svg>
